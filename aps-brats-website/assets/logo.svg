<text x="250" y="395" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="120" font-weight="900" letter-spacing="3" fill="#D4A84A">BRATS</text>
</svg>
