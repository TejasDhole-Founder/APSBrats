<rect x="0" y="0" width="500" height="500" fill="#7B1414"/>
<text x="250" y="190" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="#F9F3D7">APS</text>
<g stroke="#D4A84A" fill="none" stroke-width="3">
  <line x1="92" y1="243" x2="212" y2="243"/>
  <line x1="288" y1="243" x2="408" y2="243"/>
  <polygon points="84,243 91,236 98,243 91,250" fill="#D4A84A" stroke="none"/>
  <polygon points="402,243 409,236 416,243 409,250" fill="#D4A84A" stroke="none"/>
</g>
<g fill="#D4A84A" stroke="none">
