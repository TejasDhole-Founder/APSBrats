spring:
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    properties:
      hibernate:
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: ${SLOW_QUERY_MS:100}
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  datasource:
    hikari:
      # Default 10 suits a 2-core DB; raise with DB_POOL_SIZE after load tests show waits.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      # Logs a stack trace for any connection held longer than this: catches leaks.
      leak-detection-threshold: 20000

server:
  # Trust X-Forwarded-For only from private-network proxies (Tomcat RemoteIpValve), so
  # request.getRemoteAddr() is the real client and can't be spoofed by a header.
  forward-headers-strategy: native

# Hibernate writes queries slower than the threshold above to this logger, in every profile.
logging:
  level:
    org.hibernate.SQL_SLOW: INFO

app:
  rate-limit:
    user-per-minute: ${RATE_LIMIT_USER_PER_MINUTE:300}
    ip-per-minute: ${RATE_LIMIT_IP_PER_MINUTE:60}
  media:
    dir: ${MEDIA_DIR:./media}
    # Local disk: a relative path served by MediaWebConfig. R2: the bucket's public
    # base URL (custom domain), e.g. https://media.apsbrats.com — must be a full
    # URL there, since ImageUploadService checks every attached photo against it.
    base-url: ${MEDIA_BASE_URL:/media}
  storage:
    # local (default) or r2.
    type: ${STORAGE_TYPE:local}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:apsbrats-media}
  email:
    # Brevo transactional email (sign-in codes). Needs BREVO_API_KEY and
    # EMAIL_SENDER_ADDRESS, a sender verified in Brevo. Both blank = not configured:
    # nothing is sent, and prod answers 503 to code requests. Check it with
    # GET /api/v1/admin/email/health (ADMIN).
    api-key: ${BREVO_API_KEY:}
    sender-address: ${EMAIL_SENDER_ADDRESS:}
    sender-name: ${EMAIL_SENDER_NAME:APS Brats}
  firebase:
    # Path to the Firebase service-account JSON (Project settings → Service accounts
    # → Generate new private key). Google sign-in returns a clear 503 until this is set.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
    metrics:
      tags:
        application: aps-brats-api
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/apsbrat_db
    username: ${DB_USER:aps_user}
    password: ${DB_PASSWORD:aps_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE '+05:30'
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing local DB already has tables; baseline so Flyway can start tracking safely.
    # (In Docker/fresh DBs this is overridden to false so all migrations run.)
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: Existing schema baseline
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Blank/false here — local compose Redis has neither. Upstash needs both (see qa/prod below).
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-me}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000
  otp:
    # Dev-only universal OTP so seeded demo accounts log in without an SMS gateway.
    master: ${OTP_MASTER:000000}
  actuator:
    # Local testing: expose /actuator/prometheus and /actuator/metrics without a login. Dev profile only.
    public-metrics: true

# Local analytics (dev only, read by tools/api_dashboard.py): histograms give p50/p95/p99 latency
# for requests and for database calls.
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
---
spring:
  config:
    activate:
      on-profile: qa
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE '+05:30'
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Upstash (and most managed Redis) require both.
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    # Comma-separated web origins allowed to call the API and open /ws.
    # Defaults to the web app; set CORS_ALLOWED_ORIGINS to replace or extend it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.apsbrats.com}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000
  otp:
    master: ${OTP_MASTER:}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE '+05:30'
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.apsbrats.com}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000
  otp:
    master: ${OTP_MASTER:}
