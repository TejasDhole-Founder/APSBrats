# Local / staging dev environment for the whole backend.
#   docker compose up --build
# API:    http://localhost:8080/api
# Postgres: localhost:5432   Redis: localhost:6379
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apsbrat_db
      POSTGRES_USER: ${DB_USER:-aps_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aps_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aps_user} -d apsbrat_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Cap memory; under pressure evict only keys with a TTL (caches, rate-limit windows,
    # idempotency results), never TTL-less ones such as token-revocation markers.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apsbrat-api
    # Heap is 75% of this limit (Dockerfile). 1 GB held 1000 chat sockets in the
    # load test; the JVM exits on OutOfMemoryError and Docker restarts it.
    mem_limit: ${API_MEM_LIMIT:-1g}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/apsbrat_db
      DB_USER: ${DB_USER:-aps_user}
      DB_PASSWORD: ${DB_PASSWORD:-aps_pass}
      SPRING_DATA_REDIS_HOST: redis
      # Fresh container DB must run ALL migrations from V1 (the dev default
      # baselines at V4 for an existing DB — turn that off here).
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret}
      OTP_MASTER: ${OTP_MASTER:-000000}
      # Sign-in emails (Brevo). Blank = not sent; outside prod the code is in the API log.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-APS Brats}
      # Media storage: local disk unless these are set (see .env.example).
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-apsbrats-media}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-/media}
      # Browser origins allowed to call the API and open /ws, e.g. https://app.apsbrats.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
