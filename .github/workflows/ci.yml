
name: APS Brats CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch at a time. A newer push cancels an older unfinished run,
# except on main, so a deploy that is already uploading is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: API - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apsbrat-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test
        run: mvn -B verify

  frontend:
    name: App - analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  web-deploy:
    name: Web - build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
                flutter build web --release \
                  --dart-define=BASE_URL=https://api.apsbrats.com/api/v1 \
                  --dart-define=WS_URL=wss://api.apsbrats.com/ws

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Actions ignore the job's default working-directory, so set it here.
          workingDirectory: frontend
          command: pages deploy build/web --project-name=aps-brats-web --commit-dirty=true
