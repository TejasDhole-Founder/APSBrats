<svg xmlns="http://www.w3.org/2000/svg" width="320" height="620" viewBox="-10 -10 320 620" font-family="Roboto, Arial, sans-serif"><defs><clipPath id="c"><rect width="300" height="600" rx="26"/></clipPath></defs><g clip-path="url(#c)"><rect width="300" height="600" fill="#FBF8F6"/><rect width="300" height="70" fill="#7B1414"/><text x="20" y="18" font-size="10" font-weight="700" fill="#fff" text-anchor="start">9:41</text><rect x="252" y="9" width="26" height="10" rx="3" fill="none" stroke="#fff" opacity=".7"/><rect x="254" y="11" width="16" height="6" rx="2" fill="#fff" opacity=".7"/><text x="14" y="50" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Profile</text><rect width="300" height="600" fill="#000" opacity=".45"/><rect x="24" y="190" width="252" height="200" rx="16" fill="#fff"/><text x="42" y="224" font-size="15" font-weight="800" fill="#1A0606" text-anchor="start">Delete your account?</text><text x="42" y="250" font-size="11" font-weight="400" fill="#5A1414" text-anchor="start">Your profile will be removed. Your</text><text x="42" y="266" font-size="11" font-weight="400" fill="#5A1414" text-anchor="start">posts and messages stay, shown as</text><text x="42" y="282" font-size="11" font-weight="400" fill="#5A1414" text-anchor="start">an unknown user. This can't be</text><text x="42" y="298" font-size="11" font-weight="400" fill="#5A1414" text-anchor="start">undone.</text><text x="150" y="366" font-size="12" font-weight="700" fill="#9A7070" text-anchor="start">Cancel</text><text x="230" y="366" font-size="12" font-weight="700" fill="#C0392B" text-anchor="start">Delete</text></g><rect width="300" height="600" rx="26" fill="none" stroke="#CDB9B9" stroke-width="2"/></svg>