<path d="M300,342 C300,395 300,395 300,448" fill="none" stroke="#9A7070" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M300,506 C300,559 180,559 180,612" fill="none" stroke="#9A7070" stroke-width="1.5" marker-end="url(#ar)"/>
