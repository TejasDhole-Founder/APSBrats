<text x="300" y="1152" font-size="11" fill="#5C0F0F" text-anchor="middle" paint-order="stroke" stroke="#FBF8F6" stroke-width="4">No</text>
<path d="M300,1162 C300,1215 300,1215 300,1268" fill="none" stroke="#9A7070" stroke-width="1.5" marker-end="url(#ar)"/>
