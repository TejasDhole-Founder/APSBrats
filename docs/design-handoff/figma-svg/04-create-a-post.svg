<text x="360" y="555" font-size="11" fill="#5C0F0F" text-anchor="middle" paint-order="stroke" stroke="#FBF8F6" stroke-width="4">Too many</text>
<path d="M300,1326 C300,1379 300,1379 300,1432" fill="none" stroke="#9A7070" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="200" y="120" width="200" height="58" rx="29" fill="#7B1414"/>
<text x="300" y="145.5" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Tap "Share a memory or</text>
<text x="300" y="160.5" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">update"</text>
<rect x="200" y="284" width="200" height="58" rx="12" fill="#fff" stroke="#EADCDC" stroke-width="1.5"/>
<text x="300" y="317" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">New post sheet</text>
<rect x="200" y="448" width="200" height="58" rx="12" fill="#fff" stroke="#EADCDC" stroke-width="1.5"/>
<text x="300" y="473.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Write text and/or add up</text>
<text x="300" y="488.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">to 10 photos</text>
<polygon points="180,612 280,664 180,716 80,664" fill="#F6E7BF" stroke="#D4A84A" stroke-width="1.5"/>
<text x="180" y="653" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">School</text>
<text x="180" y="668" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">community and</text>
<text x="180" y="683" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">photos?</text>
<rect x="200" y="776" width="200" height="58" rx="12" fill="#fff" stroke="#EADCDC" stroke-width="1.5"/>
<text x="300" y="801.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Optional: mark as school</text>
<text x="300" y="816.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">memory (year + category)</text>
<polygon points="300,940 400,992 300,1044 200,992" fill="#F6E7BF" stroke="#D4A84A" stroke-width="1.5"/>
<text x="300" y="988.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Opened from an</text>
<text x="300" y="1003.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">event?</text>
<rect x="200" y="1104" width="200" height="58" rx="12" fill="#fff" stroke="#EADCDC" stroke-width="1.5"/>
<text x="300" y="1129.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Post is tagged to the</text>
<text x="300" y="1144.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">event (photos tab)</text>
<rect x="200" y="1268" width="200" height="58" rx="12" fill="#E9F3E4" stroke="#6BA35A" stroke-width="1.5"/>
<text x="300" y="1293.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Posted: appears in Feed</text>
<text x="300" y="1308.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">and Home</text>
<rect x="320" y="612" width="200" height="58" rx="12" fill="#FDEBEB" stroke="#D86060" stroke-width="1.5"/>
<text x="420" y="637.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Over 10 posts/hour:</text>
<text x="420" y="652.5" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">"You're posting a lot"</text>
<rect x="200" y="1432" width="200" height="58" rx="12" fill="#fff" stroke="#EADCDC" stroke-width="1.5"/>
<text x="300" y="1450" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">Others: like, comment,</text>
<text x="300" y="1465" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">share, report;</text>
<text x="300" y="1480" font-size="12.5" font-weight="500" fill="#1A0606" text-anchor="middle">owner/staff: pin</text>
<rect x="80" y="1642" width="14" height="14" rx="3" fill="#7B1414" stroke="#7B1414"/><text x="100" y="1654" font-size="11" fill="#9A7070">Start</text>
<rect x="180" y="1642" width="14" height="14" rx="3" fill="#fff" stroke="#EADCDC"/><text x="200" y="1654" font-size="11" fill="#9A7070">Step</text>
<rect x="280" y="1642" width="14" height="14" rx="3" fill="#F6E7BF" stroke="#D4A84A"/><text x="300" y="1654" font-size="11" fill="#9A7070">Decision</text>
<rect x="380" y="1642" width="14" height="14" rx="3" fill="#E9F3E4" stroke="#6BA35A"/><text x="400" y="1654" font-size="11" fill="#9A7070">Result</text>
<rect x="480" y="1642" width="14" height="14" rx="3" fill="#FDEBEB" stroke="#D86060"/><text x="500" y="1654" font-size="11" fill="#9A7070">Blocked / limit</text>
</svg>