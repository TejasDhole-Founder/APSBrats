<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1676" viewBox="0 0 600 1676" font-family="Roboto, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7070"/></marker></defs>
<rect width="600" height="1676" fill="#FBF8F6"/>
<text x="80" y="88" font-size="22" font-weight="700" fill="#7B1414">Create a post</text>
